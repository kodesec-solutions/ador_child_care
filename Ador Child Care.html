<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ador Child Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone frame centred on a soft stage (desktop) that becomes the full screen on phones; one scroll area per screen, tab bar with a raised SOS button. */
:root{
  --page:#E4EEEC; --bg:#F4F8F7; --surface:#FFFFFF; --surface-2:#EAF2F0; --line:#DAE6E3;
  --fg:#11302B; --muted:#5A726D; --frame:#16302C;
  --primary:#0B7A6A; --primary-ink:#FFFFFF; --primary-soft:#D5EEE8;
  --accent:#EF7A55; --accent-ink:#FFFFFF; --accent-soft:#FDE5DB;
  --ok:#17834A; --ok-soft:#DDF3E6; --warn:#A86A00; --warn-soft:#FBEFD3; --crit:#C93838; --crit-soft:#FBE1E1;
  --shadow:0 10px 30px -12px rgba(17,48,43,.25);
  --display:"Baloo Da 2","Hind Siliguri",system-ui,sans-serif;
  --body:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#081110; --bg:#0D1817; --surface:#142321; --surface-2:#1B2D2A; --line:#243A37;
  --fg:#E3F1EE; --muted:#93AAA5; --frame:#2A403C;
  --primary:#3EC4AE; --primary-ink:#052520; --primary-soft:#123B35;
  --accent:#FF977A; --accent-ink:#2A0E05; --accent-soft:#3D2219;
  --ok:#4FD08A; --ok-soft:#14352A; --warn:#F2B84B; --warn-soft:#3A2C10; --crit:#FF7A7A; --crit-soft:#3E1B1B;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --page:#081110; --bg:#0D1817; --surface:#142321; --surface-2:#1B2D2A; --line:#243A37;
  --fg:#E3F1EE; --muted:#93AAA5; --frame:#2A403C;
  --primary:#3EC4AE; --primary-ink:#052520; --primary-soft:#123B35;
  --accent:#FF977A; --accent-ink:#2A0E05; --accent-soft:#3D2219;
  --ok:#4FD08A; --ok-soft:#14352A; --warn:#F2B84B; --warn-soft:#3A2C10; --crit:#FF7A7A; --crit-soft:#3E1B1B;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}

.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px}
.device{width:390px;height:min(844px,calc(100vh - 48px));border:10px solid var(--frame);border-radius:48px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 40px 80px -30px rgba(10,40,35,.45);flex-shrink:0}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 4px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--bg)}
.statusbar .notch{width:96px;height:24px;border-radius:14px;background:var(--frame)}
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding-left:16px;padding-right:16px}

.side{max-width:330px}
.side h1{font-size:44px;font-weight:800;color:var(--fg);display:flex;gap:14px;align-items:center}
.side .bn{font-size:28px;color:var(--primary);font-weight:700;margin-top:-4px}
.side p{color:var(--muted)}
.side ul{padding:0;margin:18px 0;list-style:none;display:grid;gap:10px}
.side li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.side li i{flex:none;width:22px;height:22px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.side .seg{margin-top:8px;background:var(--surface)}
@media (max-width:980px){.side{display:none}}
@media (max-width:640px){
  .stage{padding:0}
  .device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none}
}

/* type */
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.sm{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* top bars */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;flex:none}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px}
.screen-head{padding:8px 16px 12px}
.screen-head h1{font-size:28px;font-weight:700}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:50px;color:var(--muted);width:100%;text-align:left}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;height:100%;font-size:15px}
.search:focus-within{border-color:var(--primary)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.chip-btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:8px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-weight:700}
.s-ok{background:var(--ok-soft);color:var(--ok)}
.s-few{background:var(--warn-soft);color:var(--warn)}
.s-full{background:var(--crit-soft);color:var(--crit)}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--primary)}30%{box-shadow:0 0 0 4px var(--primary-soft)}100%{box-shadow:0 0 0 0 transparent}}

/* sections */
.section{margin-top:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px;margin-bottom:10px}
.sec-head h2{font-size:19px;font-weight:700}
.link{color:var(--primary);font-weight:600;font-size:14px}

/* home */
.greet{padding:4px 16px 14px}
.greet h1{font-size:27px;font-weight:700}
.sos-card{margin:16px 16px 0;border-radius:24px;padding:18px;background:var(--accent);color:var(--accent-ink);display:flex;gap:14px;align-items:center;position:relative;overflow:hidden;width:calc(100% - 32px);text-align:left}
.sos-card::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:24px solid rgba(255,255,255,.14)}
.sos-card .ring{width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.sos-card h3{font-size:18px;font-weight:700}
.sos-card p{margin:0;font-size:13.5px;opacity:.92}
.stats{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:14px 10px 12px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;color:var(--primary);font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.cat .ico{width:100%;aspect-ratio:1;max-width:100%;border-radius:20px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.cat:nth-child(2) .ico{background:var(--accent-soft);color:var(--accent)}
.cat:nth-child(4) .ico{background:var(--surface-2);color:var(--fg)}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:244px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px}
.mini h3{font-size:16px;font-weight:700;font-family:var(--body)}
.tip-hero{margin:0 16px;border-radius:24px;padding:18px;background:var(--primary);color:var(--primary-ink);display:block;width:calc(100% - 32px);text-align:left;position:relative;overflow:hidden}
.tip-hero h3{font-size:20px;font-weight:700;margin:6px 0 6px;max-width:85%}
.tip-hero p{margin:0;font-size:13.5px;opacity:.9;max-width:85%}
.tip-hero .big-ico{position:absolute;right:-10px;bottom:-14px;opacity:.18}
.tip-hero .eyebrow{color:inherit;opacity:.85}

/* lists */
.list{display:grid;gap:12px;padding:0 16px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:12px;text-align:left;width:100%;position:relative}
.hcard-top{display:flex;gap:12px;align-items:flex-start}
.avatar{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;background:var(--primary-soft);color:var(--primary)}
.avatar.pv{background:var(--accent-soft);color:var(--accent)}
.hc-body{flex:1;min-width:0}
.hc-body h3{font-family:var(--body);font-size:16px;font-weight:700;line-height:1.3}
.meta{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.meta svg{flex:none}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.save{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.save[aria-pressed="true"]{color:var(--accent)}
.save[aria-pressed="true"] svg{fill:var(--accent)}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.count-line{padding:10px 16px 8px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}

/* detail */
.d-hero{padding:4px 16px 18px}
.d-hero h1{font-size:26px;font-weight:700;margin:12px 0 6px}
.units{display:grid;gap:10px;padding:0 16px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;gap:8px}
.unit-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.unit-name{font-weight:700;font-size:16px}
.unit-desc{font-size:12.5px;color:var(--muted)}
.unit-count{display:flex;align-items:baseline;gap:8px}
.unit-count .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.bar.s-ok i{background:var(--ok)} .bar.s-few i{background:var(--warn)} .bar.s-full i{background:var(--crit)}
.bar.s-ok,.bar.s-few,.bar.s-full{background:var(--surface-2)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.act.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.info{margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 16px}
.info-row{display:flex;gap:12px;align-items:center;padding:12px 0;font-size:14px}
.info-row+.info-row{border-top:1px solid var(--line)}
.info-row svg{color:var(--primary);flex:none}
.fac{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.fac span{padding:6px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:500}

/* doctors */
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;gap:12px;text-align:left;width:100%;align-items:flex-start}
.dav{width:54px;height:54px;border-radius:18px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--fg)}
.slot-chip{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:3px 9px;border-radius:8px;margin-top:8px}
.slot-chip.later{color:var(--muted);background:var(--surface-2)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:14px;gap:12px}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.doc-hero{text-align:center;padding:4px 16px 16px}
.doc-hero .dav{width:88px;height:88px;border-radius:28px;font-size:30px;margin:6px auto 12px}
.doc-hero h1{font-size:24px;font-weight:700}
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.trio div{padding:12px 6px;text-align:center}
.trio div+div{border-left:1px solid var(--line)}
.trio b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.trio span{font-size:12px;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;padding:10px 0;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:center;line-height:1.2}
.day b{display:block;font-family:var(--display);font-size:20px;margin-top:2px}
.day span{font-size:12px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.slot{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.slot:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.sticky-cta{padding:12px 16px 14px;background:var(--bg);border-top:1px solid var(--line)}
.btn{height:52px;width:100%;border-radius:16px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}

/* tips */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;gap:14px;text-align:left;width:100%;align-items:center}
.tthumb{width:74px;height:74px;border-radius:16px;flex:none;display:grid;place-items:center}
.tc-newborn{background:var(--primary-soft);color:var(--primary)}
.tc-nutrition{background:var(--ok-soft);color:var(--ok)}
.tc-vaccine{background:var(--surface-2);color:var(--fg)}
.tc-illness{background:var(--accent-soft);color:var(--accent)}
.tc-safety{background:var(--warn-soft);color:var(--warn)}
.tcard h3{font-family:var(--body);font-size:15.5px;font-weight:700;line-height:1.35}
.feature{margin:0 16px 14px;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:left;display:block;width:calc(100% - 32px)}
.feature .art{height:150px;display:grid;place-items:center}
.feature .txt{padding:14px 16px 16px}
.feature h3{font-size:20px;font-weight:700;margin:4px 0}
.article{padding:0 16px 24px}
.article .art{height:180px;border-radius:24px;display:grid;place-items:center;margin-bottom:16px}
.article h1{font-size:26px;font-weight:700;margin:6px 0 10px}
.article .lede{font-size:16px;color:var(--fg);margin:0 0 14px}
.points{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.points li{display:flex;gap:12px;align-items:flex-start;max-width:65ch}
.points li i{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-style:normal;font-size:13px;font-weight:700;font-family:var(--display)}
.warn-box{margin-top:18px;background:var(--crit-soft);border-radius:20px;padding:14px 16px}
.warn-box h3{font-family:var(--body);font-size:15px;color:var(--crit);display:flex;gap:8px;align-items:center;margin-bottom:6px}
.warn-box ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.byline{display:flex;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:16px}
.byline .dav{width:40px;height:40px;border-radius:12px;font-size:14px}

/* emergency */
.em-head{background:var(--crit);color:#fff;padding:12px 16px 22px}
.em-head .iconbtn{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.em-head h1{font-size:30px;font-weight:800;margin-top:12px}
.hotline{margin:-12px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.hotline .big{font-family:var(--display);font-size:38px;font-weight:800;color:var(--crit);line-height:1;font-variant-numeric:tabular-nums;user-select:all}
.hotline.secondary{margin-top:10px;box-shadow:none}
.hotline.secondary .big{font-size:28px;color:var(--fg)}
.copy-btn{margin-left:auto;height:40px;padding:0 14px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;flex:none}
.steps{list-style:none;margin:0 16px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:grid;gap:10px}
.steps li{display:flex;gap:10px;font-size:14px}
.steps svg{color:var(--ok);flex:none;margin-top:2px}

/* profile */
.pcard{margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center}
.child{margin:12px 16px 0;border-radius:22px;padding:16px;background:var(--primary-soft);display:flex;gap:14px;align-items:center}
.child .dav{background:var(--surface);color:var(--primary)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{height:38px;border-radius:11px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--primary)}

  n:{en:'Winter is here: spot pneumonia early',bn:'শীত এসেছে: নিউমোনিয়ার লক্ষণ আগেই চিনুন'},
  s:{en:'Count your child’s breaths. Fast breathing is often the first sign.',bn:'শিশুর শ্বাস গুনুন। দ্রুত শ্বাস প্রায়ই প্রথম লক্ষণ।'},
  p:{en:['Count breaths for one full minute while your child is calm or asleep.','Fast breathing means 60 or more a minute under 2 months, 50 or more at 2–12 months, and 40 or more at 1–5 years.','Watch the lower chest. If it sinks in when your child breathes in, that is chest indrawing.','Keep your child warm, keep breastfeeding, and give plenty of fluids.'],
     bn:['শিশু শান্ত বা ঘুমন্ত অবস্থায় পুরো এক মিনিট শ্বাস গুনুন।','২ মাসের নিচে মিনিটে ৬০ বা বেশি, ২–১২ মাসে ৫০ বা বেশি, ১–৫ বছরে ৪০ বা বেশি হলে তা দ্রুত শ্বাস।','বুকের নিচের অংশ খেয়াল করুন। শ্বাস নেওয়ার সময় ভেতরে দেবে গেলে তা বুক দেবে যাওয়া।','শিশুকে গরম রাখুন, বুকের দুধ চালিয়ে যান, বেশি করে তরল দিন।']},
  w:{en:['The chest sinks in with each breath','Your child cannot drink or breastfeed','Lips or tongue look bluish','Convulsions or unusual sleepiness'],bn:['প্রতি শ্বাসে বুক দেবে যায়','শিশু পান করতে বা বুকের দুধ টানতে পারছে না','ঠোঁট বা জিহ্বা নীলচে দেখায়','খিঁচুনি বা অস্বাভাবিক ঝিমুনি']}},

 {i:'vaccine',c:'var(--accent)',bg:'var(--accent-soft)',n:{en:'Ayaan’s MR-1 vaccine is due in 4 weeks',bn:'৪ সপ্তাহ পর আয়ানের এমআর-১ টিকা'},s:{en:'Nearest EPI centre: Mirpur-2',bn:'নিকটতম ইপিআই কেন্দ্র: মিরপুর-২'},go:'tip:t3'}
];

/* ---------- logic ---------- */
const st=(f,tot)=>f===0?'full':(f<=2||f/tot<=.12)?'few':'ok';
const kmTxt=k=>n(k<20?k.toFixed(1):Math.round(k))+' '+t('km');
const upd=h=>{const m=Math.floor((Date.now()-h.upd)/M);return m<1?t('justNow'):t('minAgo',{n:n(m)})};
const fmtTime=s=>{const[hh,mm]=s.split(':').map(Number);if(S.lang==='bn'){const p=hh<12?'সকাল':hh<15?'দুপুর':hh<18?'বিকাল':hh<20?'সন্ধ্যা':'রাত';return p+' '+n((hh%12||12)+':'+String(mm).padStart(2,'0'))}return (hh%12||12)+':'+String(mm).padStart(2,'0')+(hh<12?' AM':' PM')};
const DAYN={en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],bn:['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি']};
const MON={en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],bn:['জানু','ফেব্রু','মার্চ','এপ্রি','মে','জুন','জুলা','আগ','সেপ্টে','অক্টো','নভে','ডিসে']};
const dayAt=i=>{const d=new Date();d.setDate(d.getDate()+i);return d};
const totalFree=u=>H.reduce((a,h)=>a+(h.u[u]?h.u[u][0]:0),0);
const greet=()=>{const h=new Date().getHours();return t(h<12?'gm':h<17?'ga':'ge')};
const typeTag=h=>`<span class="tag">${t(h.type)}</span>`;

function pill(h,u){const[f,tot]=h.u[u];const s=st(f,tot);return `<span class="pill s-${s}" data-pill="${h.id}:${u}"><b>${L(UNITS[u].n)}</b> ${n(f)}/${n(tot)}</span>`}
function unitRow(h,u){const[f,tot]=h.u[u];const s=st(f,tot);const occ=Math.round((tot-f)/tot*100);
 return `<div class="unit" data-row="${h.id}:${u}"><div class="unit-top"><div><div class="unit-name">${L(UNITS[u].n)}</div><div class="unit-desc">${L(UNITS[u].d)}</div></div><span class="pill s-${s}">${t(s)}</span></div>
 <div class="unit-count"><span class="big">${n(f)}</span><span class="muted sm">${t('freeOf',{n:n(tot)})}</span><span class="muted sm" style="margin-left:auto">${t('occupied',{n:n(occ)})}</span></div>
 <div class="bar s-${s}"><i style="width:${occ}%"></i></div></div>`}

function hCard(h){const sv=S.saved.has(h.id);const units=S.unit!=='all'?[S.unit]:Object.keys(h.u);
 return `<div class="hcard"><button class="hcard-top" style="text-align:left;padding-right:34px" data-a="go:hospital:${h.id}"><span class="avatar ${h.type!=='govt'?'pv':''}">${h.ab}</span><span class="hc-body"><h3>${L(h.n)}</h3><span class="meta">${ic('pin',14)}${L(h.a)} · ${kmTxt(h.km)}</span></span></button>
 <div class="pills">${units.map(u=>pill(h,u)).join('')}</div>
 <div class="meta" style="justify-content:space-between">${typeTag(h)}<span class="live" data-upd="${h.id}">${upd(h)}</span></div>
 <button class="save" aria-label="Save" aria-pressed="${sv}" data-a="save:${h.id}">${ic('heart',20)}</button></div>`}

function dCard(d){const h=HB[d.h];const free=d.slots.filter(s=>!d.off.includes(s));
 const chip=d.today?`<span class="slot-chip">${ic('clock',14)}${t('today')}, ${fmtTime(free[0])}</span>`:`<span class="slot-chip later">${ic('clock',14)}${t('tomorrow')}, ${fmtTime(d.slots[0])}</span>`;
 return `<button class="dcard" data-a="go:doctor:${d.id}"><span class="dav" style="background:${d.hue}">${d.ini}</span><span style="flex:1;min-width:0"><h3 style="font-family:var(--body);font-size:16px;font-weight:700">${L(d.n)}</h3><span class="meta">${L(SPEC[d.s])} · ${t('yrs',{n:n(d.exp)})}</span><span class="meta">${ic('hosp',14)}${L(h.n)}</span><span style="display:flex;justify-content:space-between;align-items:center">${chip}<span class="sm num" style="font-weight:600;margin-top:8px">${money(d.fee)}</span></span></span></button>`}

function tCard(x){return `<button class="tcard" data-a="go:tip:${x.id}"><span class="tthumb tc-${x.c}">${ic(x.c,30,1.7)}</span><span style="flex:1;min-width:0"><span class="eyebrow">${L(TCAT[x.c])} · ${t('minRead',{n:n(x.min)})}</span><h3>${L(x.n)}</h3><span class="sm muted">${L(x.ago)}</span></span></button>`}

/* ---------- screens ---------- */
function splash(){return `<div class="splash"><span class="orb o1"></span><span class="orb o2"></span>
 <div class="splash-main">${logo(76)}<h1>Ador<small>আদর</small></h1><div class="tagline">${t('tag')}</div><p>${t('splashSub')}</p></div>

 <button class="btn" data-a="start">${t('start')} ${ic('chev',18,2.4)}</button><div class="sm muted" style="text-align:center">${t('demo')}</div></div></div>`}

function home(){const near=[...H].sort((a,b)=>a.km-b.km).slice(0,4);const tip=TIPS[0];const docs=D.filter(d=>d.today).slice(0,3);
 return `<div class="scroll"><div class="topbar"><div class="brand">${logo(36)}${t('appName')}</div><div style="display:flex;gap:8px"><button class="iconbtn" aria-label="${t('notifications')}" data-a="go:notifs">${ic('bell')}<span class="dot"></span></button><button class="iconbtn" aria-label="${t('profile')}" data-a="tab:profile">${ic('user')}</button></div></div>
 <div class="greet"><div class="muted">${greet()}, ${t('parent')}</div><h1>${t('howIs')}</h1></div>
 <div class="pad"><button class="search" data-a="searchgo">${ic('search')}<span>${t('searchPh')}</span></button></div>

 if(s.type==='book'){const d=DB[s.id];const h=HB[d.h];const start=d.today?0:1;const dt=dayAt(S.day+start);const dl=(S.day+start===0?t('today'):DAYN[S.lang][dt.getDay()])+', '+n(dt.getDate())+' '+MON[S.lang][dt.getMonth()];
  if(s.done){body=`<div class="success"><div class="tick">${ic('check',36,2.6)}</div><h2>${t('bookedTitle')}</h2><div class="summary"><div><span>${t('serial')}</span><b class="num">${n(s.serial)}</b></div><div><span>${t('doctor')}</span><b>${L(d.n)}</b></div><div><span>${t('when')}</span><b>${dl} · ${fmtTime(S.slot)}</b></div></div><p class="sm muted">${t('arrive')}</p><p class="sm muted">${t('demoNote')}</p><button class="btn" data-a="closebook">${t('done')}</button></div>`}

 return `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${body}</div></div>`}

/* ---------- render ---------- */
const app=document.getElementById('app');
function view(){if(!S.started)return splash();const top=S.stack[S.stack.length-1];
 if(top){const[s,p]=top;return ({hospital,doctor,tip,emergency,notifs})[s](p)}
 return ({home,hospitals,doctors,tips,profile})[S.tab]()}
function tabbar(){if(!S.started||S.stack.length)return '';const tb=(k,i)=>`<button class="tab" data-a="tab:${k}" ${S.tab===k?'aria-current="page"':''}>${ic(i,23)}${t(k==='hospitals'?'hospitals':k)}</button>`;
 return `<nav class="tabbar">${tb('home','home')}${tb('hospitals','hosp')}<button class="tab-sos" data-a="go:emergency"><span class="c">${ic('pulse',26,2.3)}</span>${t('sos')}</button>${tb('doctors','doc')}${tb('tips','tips')}</nav>`}
function render(keep){const sc=app.querySelector('.scroll');const y=keep&&sc?sc.scrollTop:0;
 document.documentElement.lang=S.lang;
 app.innerHTML=view()+tabbar()+sheet()+(S.toast?`<div class="toast" role="status">${ic('check',18,2.4)}${S.toast}</div>`:'');
 const ns=app.querySelector('.scroll');if(ns)ns.scrollTop=y;renderSide()}
function renderSide(){document.getElementById('side').innerHTML=`<h1>${logo(56)}Ador</h1><div class="bn">আদর</div><p>${t('tag')}. ${t('demo')}.</p>
 <div class="seg"><button data-a="lang:en" aria-pressed="${S.lang==='en'}">English</button><button data-a="lang:bn" aria-pressed="${S.lang==='bn'}">বাংলা</button></div>
 <div class="eyebrow" style="margin-top:22px">${t('tryTitle')}</div><ul>${['try1','try2','try3','try4','try5'].map((k,i)=>`<li><i>${n(i+1)}</i>${t(k)}</li>`).join('')}</ul>
 <div class="eyebrow">${t('legend')}</div><div class="legend"><span class="pill s-ok">${t('ok')}</span><span class="pill s-few">${t('few')}</span><span class="pill s-full">${t('full')}</span></div>`}
let toastT;function toast(m){S.toast=m;render(true);clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;const el=app.querySelector('.toast');if(el)el.remove()},2200)}
function copyNum(v){const done=()=>toast(t('copied'));try{navigator.clipboard.writeText(v).then(done,done)}catch(e){done()}}

const A={
 start(){S.started=true;try{localStorage.setItem('ador-started','1')}catch(e){}render()},
 lang(v){S.lang=v;try{localStorage.setItem('ador-lang',v)}catch(e){}render(true)},
 tab(v){S.tab=v;S.stack=[];render()},
 go(s,p){if(s==='doctor'){S.day=0;S.slot=null}S.stack.push([s,p]);S.sheet=null;render()},
 back(){S.stack.pop();render()},
 searchgo(){S.tab='hospitals';S.stack=[];render();setTimeout(()=>{const i=document.getElementById('hq');if(i)i.focus()},50)},
 unitgo(v){S.unit=v;S.div='all';S.tab='hospitals';S.stack=[];render()},
 div(v){S.div=v;render(true)},unit(v){S.unit=v;render(true)},spec(v){S.spec=v;render(true)},tcat(v){S.tcat=v;render(true)},
 onlytoday(){S.onlyToday=!S.onlyToday;render(true)},notif(){S.notif=!S.notif;render(true)},
 save(v){if(S.saved.has(v)){S.saved.delete(v);toast(t('unsavedToast'))}else{S.saved.add(v);toast(t('savedToast'))}},
 like(v){if(!S.liked.has(v)){S.liked.add(v);toast(t('markedHelpful'))}else{S.liked.delete(v);render(true)}},
 share(){toast(t('linkCopied'))},
 copy(v){copyNum(v)},
 day(v){S.day=+v;S.slot=null;render(true)},
 slot(v){S.slot=v.replace('-',':');render(true)},
 sheet(type,id){S.sheet={type,id};render(true)},
 close(){S.sheet=null;render(true)},
 scrim(v,w,el,e){if(e.target===el){S.sheet=null;render(true)}},
 confirmbook(){S.sheet.done=true;S.sheet.serial=Math.floor(Math.random()*18)+4;render(true)},
 closebook(){S.sheet=null;S.slot=null;S.stack.pop();render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const parts=el.dataset.a.split(':');const a=parts.shift();
 if(a==='copy'){A.copy(parts.join(':'));return}
 if(A[a]){A[a](parts[0],parts[1],el,e)}});
document.addEventListener('input',e=>{if(e.target.id==='hq'){S.q=e.target.value;document.getElementById('hlist').innerHTML=hospList()}
 if(e.target.id==='dq'){S.dq=e.target.value;document.getElementById('dlist').innerHTML=docList()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='reqform'){const child=document.getElementById('rq-child').value||t('childName');const unit=document.getElementById('rq-unit').value;
 Object.assign(S.sheet,{done:true,child,unit,ref:'ADR-'+(4000+Math.floor(Math.random()*5000))});render(true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render(true)}});

/* ---------- live simulation ---------- */
setInterval(()=>{if(!S.started)return;
 const h=H[Math.floor(Math.random()*H.length)];const us=Object.keys(h.u);const u=us[Math.floor(Math.random()*us.length)];const v=h.u[u];
 const d=Math.random()<.5?-1:1;v[0]=Math.max(0,Math.min(v[1],v[0]+d));h.upd=Date.now();
 if(S.sheet)return;
 document.querySelectorAll(`[data-pill="${h.id}:${u}"]`).forEach(el=>{const w=document.createElement('span');w.innerHTML=pill(h,u);const ne=w.firstChild;ne.classList.add('flash');el.replaceWith(ne)});
 document.querySelectorAll(`[data-row="${h.id}:${u}"]`).forEach(el=>{const w=document.createElement('div');w.innerHTML=unitRow(h,u);const ne=w.firstChild;ne.classList.add('flash');el.replaceWith(ne)});
 document.querySelectorAll('[data-upd]').forEach(el=>{el.textContent=upd(HB[el.dataset.upd])});
 document.querySelectorAll('[data-stat]').forEach(el=>{el.textContent=n(totalFree(el.dataset.stat))});
},5000);
setInterval(()=>{const c=document.getElementById('clock');if(c){const d=new Date();c.textContent=d.getHours()%12||12;c.textContent+=':'+String(d.getMinutes()).padStart(2,'0')}},10000);
(()=>{const c=document.getElementById('clock');const d=new Date();c.textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')})();
render();
</script>

</body></html>
